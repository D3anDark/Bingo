<!doctype html>
<html lang="pl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>Bingo</title>
		<meta name="description" content="Twórz plansze bingo na imprezy, streamy i spotkania. Graj sam albo ze znajomymi na kod zaproszenia." />
		<meta name="theme-color" content="#000000" />
		<meta property="og:title" content="Bingo" />
		<meta property="og:description" content="Plansze bingo. Sam albo ze znajomymi na kod zaproszenia." />
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="pl_PL" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<script>
			// Before first paint, so a saved theme never flashes the other one.
			try {
				const theme = localStorage.getItem('bingo:theme');
				if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
